# Shared service definitions for all environments.
#
# Never run this file alone — combine it with an environment override:
#   docker compose -f docker-compose.base.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.base.yml -f docker-compose.prod.yml up
#   docker compose -f docker-compose.base.yml -f docker-compose.ec2.yml up
#   docker compose -f docker-compose.base.yml -f docker-compose.debug.yml up
#   docker compose -f docker-compose.base.yml -f docker-compose.e2e.yml up
#
# Overrides own anything environment-specific: container names, published
# ports vs expose, redis/chroma profiles, NODE_ENV, extra volumes, logging.

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - ai-chat-network

  chroma:
    # Pinned: `latest` moved to Chroma 1.x, which dropped the /api/v1 API the
    # old client used and broke @Chat. Bump together with the chromadb npm
    # client in packages/mcp-assistant.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    networks:
      - ai-chat-network
    volumes:
      # Chroma 1.x persists to /data (0.x used /chroma/chroma). New volume
      # name so the old 0.x data is never mounted into 1.x; the index is
      # derived data and @Chat rebuilds it on startup.
      - chroma-index:/data
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp can make the request
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-chat-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      - CLIENT_URL=${CLIENT_URL:-*}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      # Gemini and Mistral chat run through OpenRouter; these two keys only
      # feed @Chat's embeddings
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - Z_API_KEY=${Z_API_KEY}
      - LLAMA_API_KEY=${LLAMA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-}
      - OPENROUTER_APP_URL=${OPENROUTER_APP_URL:-}
      - AI_CHAT_VERBOSE_CONTEXT=${AI_CHAT_VERBOSE_CONTEXT:-false}
      - AI_CHAT_SKIP_HEALTHCHECK=${AI_CHAT_SKIP_HEALTHCHECK:-false}
      - AI_CHAT_RECHECK_AVAILABILITY=${AI_CHAT_RECHECK_AVAILABILITY:-false}
      - AI_CHAT_HEALTH_TTL_MS=${AI_CHAT_HEALTH_TTL_MS:-}
      - DISABLED_AI_MODELS=${DISABLED_AI_MODELS:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CHAT_ASSISTANT_AUTO_INDEX=true
      - NODE_PATH=/app/server/node_modules
      - CHROMA_URL=${CHROMA_URL:-http://chroma:8000}
      - CHAT_ASSISTANT_COLLECTION=ai-chat-workspace
      # @Chat: embeddings provider for the code index (mistral | openai |
      # gemini | cohere) and the Claude model that runs the agent
      - CHAT_ASSISTANT_EMBEDDINGS=${CHAT_ASSISTANT_EMBEDDINGS:-}
      - CHAT_ASSISTANT_MODEL=${CHAT_ASSISTANT_MODEL:-}
    restart: unless-stopped
    networks:
      - ai-chat-network
    # Note: no depends_on for redis/chroma — handled by network + health
    # checks in code; external instances may be used via profiles.

  ai-chat-client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        - VITE_SERVER_URL=${SERVER_URL:-http://localhost:3001}
    depends_on:
      - ai-chat-server
    restart: unless-stopped
    networks:
      - ai-chat-network

networks:
  ai-chat-network:
    driver: bridge

volumes:
  redis-data:
  chroma-index:
