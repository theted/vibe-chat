name: Deploy to EC2

on:
  # Deploy only what CI passed: a red master must not ship
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  # workflow_run's github.sha is master's tip, which may be newer than what CI tested
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # docker compose build on the EC2 box regularly exceeds the action's 10m default
          command_timeout: 30m
          script: |
            set -e
            cd /opt/vibe-chat
            git fetch origin
            git checkout ${{ env.DEPLOY_SHA }}
            COMPOSE_FILES="-f docker-compose.base.yml -f docker-compose.ec2.yml"
            # Log shipping is opt-in until the instance role exists (see docker-compose.cloudwatch.yml)
            if grep -qx 'CLOUDWATCH_LOGS=true' .env; then
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.cloudwatch.yml"
            fi
            docker compose $COMPOSE_FILES --env-file .env up -d --build
            docker image prune -f

  deploy-frontend:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build frontend
        run: bun run build:client
        env:
          VITE_SERVER_URL: ${{ secrets.SERVER_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync packages/client/dist "s3://${{ secrets.FRONTEND_S3_BUCKET }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          if [ -n "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/*"
          fi
