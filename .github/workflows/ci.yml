name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Validate AI model registry
        run: bun run validate:models

      - name: Run tests
        run: bun run test
